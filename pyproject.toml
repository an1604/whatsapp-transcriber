[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-transcriber"
version = "0.1.0"
description = "WhatsApp community video transcriber and summarizer"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "pyyaml>=6.0",
    "alembic>=1.13",
    # Step 2: URL extraction + downloading
    "yt-dlp>=2024.1.0",
    "tldextract>=3.6",
    # Step 3: Transcription
    "faster-whisper>=1.0",
    # Step 4: Summarization
    "litellm>=1.40",
    # Step 5/6: Web UI
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "sse-starlette>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-mock>=3.14",
    "respx>=0.20",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
