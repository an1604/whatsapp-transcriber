whatsapp:
  sidecar_url: "http://whatsapp-sidecar:3000"
  community_ids: []
  scrape_interval_minutes: 60

platforms:
  enabled:
    - youtube
    - instagram
    - tiktok
    - facebook

transcriber:
  type: faster_whisper
  params:
    model_size: small
    device: cpu
    compute_type: int8
    language: auto

summarizer:
  type: litellm
  params:
    model: "ollama/llama3.2"
    api_base: "http://ollama:11434"
    temperature: 0.3
  prompt_path: /app/config/prompts/summarize_default.txt

deduplication:
  enabled: true
  resolve_redirects: false

storage:
  database_url: "sqlite+aiosqlite:////data/app.db"
  audio_cache_dir: /data/audio
  audio_retention_days: 7

web:
  host: "0.0.0.0"
  port: 8000
