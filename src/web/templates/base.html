<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}WhatsApp Transcriber{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
      --accent: #25d366; --accent-dim: #1a9e4a;
      --text: #e2e8f0; --muted: #6b7280; --danger: #ef4444;
      --warn: #f59e0b; --info: #3b82f6; --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.6; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Layout */
    .layout { display: flex; min-height: 100vh; }
    nav { width: 220px; background: var(--surface); border-right: 1px solid var(--border);
          padding: 24px 0; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .nav-logo { padding: 0 20px 24px; font-size: 16px; font-weight: 700; color: var(--accent); }
    .nav-logo span { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
    nav ul { list-style: none; }
    nav li a { display: block; padding: 10px 20px; color: var(--text); border-left: 3px solid transparent; transition: all .15s; }
    nav li a:hover, nav li a.active { background: rgba(37,211,102,.08); border-left-color: var(--accent); color: var(--accent); text-decoration: none; }
    main { flex: 1; padding: 32px; overflow-x: hidden; max-width: 1100px; }

    /* Cards */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .card-header { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 12px; }

    /* Stats grid */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
    .stat-val { font-size: 32px; font-weight: 700; line-height: 1; }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .stat.complete .stat-val { color: var(--accent); }
    .stat.failed  .stat-val { color: var(--danger); }
    .stat.progress .stat-val { color: var(--warn); }

    /* Table */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }

    /* Badges */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge-complete  { background: rgba(37,211,102,.15); color: var(--accent); }
    .badge-failed    { background: rgba(239,68,68,.15);  color: var(--danger); }
    .badge-progress  { background: rgba(245,158,11,.15); color: var(--warn); }
    .badge-discovered{ background: rgba(59,130,246,.15); color: var(--info); }
    .badge-platform  { background: rgba(255,255,255,.06); color: var(--muted); }

    /* Forms */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input[type=text], input[type=url], select, textarea {
      width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 14px; font-family: inherit;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: var(--radius);
           border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; transition: all .15s; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: var(--accent-dim); }
    .btn-danger  { background: rgba(239,68,68,.15); color: var(--danger); border: 1px solid rgba(239,68,68,.3); }
    .btn-danger:hover  { background: rgba(239,68,68,.25); }
    .btn-ghost   { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover   { color: var(--text); border-color: var(--text); }
    .btn[disabled], .btn.htmx-request { opacity: .5; cursor: not-allowed; }

    /* Alerts */
    .alert { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px; font-size: 13px; }
    .alert-success { background: rgba(37,211,102,.1); border: 1px solid rgba(37,211,102,.3); color: var(--accent); }
    .alert-error   { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.3);  color: var(--danger); }
    .alert-info    { background: rgba(59,130,246,.1);  border: 1px solid rgba(59,130,246,.3);  color: var(--info); }

    /* Misc */
    .page-title { font-size: 22px; font-weight: 700; margin-bottom: 24px; }
    .section-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
    .text-muted { color: var(--muted); }
    .mono { font-family: "Cascadia Code", "Fira Code", monospace; font-size: 12px; }
    .truncate { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mt-4 { margin-top: 16px; } .mt-8 { margin-top: 32px; }
    .flex { display: flex; } .gap-2 { gap: 8px; } .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .htmx-indicator { display: none; } .htmx-request .htmx-indicator { display: inline; }

    /* Transcript block */
    .transcript-block { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
                        padding: 16px; max-height: 320px; overflow-y: auto; white-space: pre-wrap;
                        font-size: 13px; line-height: 1.7; color: var(--text); }
    /* Filters */
    .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .filters select { width: auto; }

    /* Pagination */
    .pagination { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
    .pager { padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius);
             background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; }
    .pager.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .pager[disabled] { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="layout">
  <nav>
    <div class="nav-logo">📱 Transcriber<span>WhatsApp Video AI</span></div>
    <ul>
      <li><a href="/" class="{% if request.url.path == '/' %}active{% endif %}">🏠 Dashboard</a></li>
      <li><a href="/inbox" class="{% if request.url.path == '/inbox' %}active{% endif %}">📥 Inbox</a></li>
      <li><a href="/videos" class="{% if request.url.path.startswith('/videos') %}active{% endif %}">🎬 Videos</a></li>
      <li><a href="/submit" class="{% if request.url.path == '/submit' %}active{% endif %}">➕ Submit URL</a></li>
      <li><a href="/jobs" class="{% if request.url.path == '/jobs' %}active{% endif %}">⚙️ Jobs</a></li>
      <li><a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">🔧 Settings</a></li>
    </ul>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
